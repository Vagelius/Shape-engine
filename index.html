<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Background video */
        video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -5;
        }

        /* Dark overlay */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: -1;
        }

        .content {
            text-align: center;
        }

        h1 {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 72px;
            margin: 0;
            border: 10px solid rgb(98, 93, 93);
            border-radius: 5px;
            padding: 20px;
        }

        h3 {
            font-size: 25px;
            margin-top: 20px;
        }

        .download {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: #343934;
            color: white;
            text-decoration: none;
            font-size: 25px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .download:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .contact {
            margin-top: 25px;
            font-size: 18px;
        }

        .contact a {
            color: white;
        }

    </style>
</head>

<body>

    <video autoplay muted loop>
        <source src="videotraler.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <div class="overlay"></div>

    <div class="content">
        <h1>Welcome to SHAPEZEBRIA</h1>

        <h3>A simple 2D shape engine</h3>

        <a class="download" href="SHAPEZEBRIA.zip" download>
            Download for windows
        </a>

        <div class="contact">
            Contact: 
            <a href="mailto:your@email.com">
                your@email.com
            </a>
        </div>
    </div>

</body>
</html>

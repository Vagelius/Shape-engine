<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAPEZEBRIA — 2D Shape Engine</title>
<style>
    :root {
        --accent: #7dd3c0;
        --accent-dim: #4f9d8c;
        --panel: rgba(15, 18, 17, 0.55);
        --panel-border: rgba(255, 255, 255, 0.12);
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        height: 100%;
    }

    body {
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        color: #f2f2f0;
        padding: 40px 20px;
    }

    /* Background video */
    video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -5;
    }

    /* Dark gradient overlay for readability + mood */
    .overlay {
        position: fixed;
        inset: 0;
        background:
            linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.65) 100%);
        z-index: -1;
    }

    .content {
        background: var(--panel);
        backdrop-filter: blur(28px) saturate(140%);
        -webkit-backdrop-filter: blur(28px) saturate(140%);
        border: 1px solid var(--panel-border);
        padding: 56px 64px;
        border-radius: 24px;
        text-align: center;
        max-width: 640px;
        width: 100%;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: rise 0.8s ease-out;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 12px;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 14px;
        opacity: 0.9;
    }

    h1 {
        font-size: clamp(36px, 6vw, 56px);
        margin: 0;
        font-weight: 800;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1.1;
    }

    .author {
        margin-top: 12px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 400;
    }

    .tagline {
        font-size: 18px;
        font-weight: 400;
        margin-top: 22px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.5;
    }

    .downloads {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 36px;
    }

    .download {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        border-radius: 12px;
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .download svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }

    .download:hover {
        background: var(--accent);
        color: #0c1210;
        border-color: var(--accent);
        transform: translateY(-3px);
    }

    .download:active {
        transform: translateY(-1px) scale(0.98);
    }

    .divider {
        margin: 36px auto 0;
        width: 60px;
        height: 1px;
        background: rgba(255, 255, 255, 0.2);
    }

    .contact {
        margin-top: 24px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.65);
    }

    .contact a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease;
    }

    .contact a:hover {
        border-color: var(--accent);
    }

    @media (max-width: 520px) {
        .content {
            padding: 40px 28px;
        }
        .downloads {
            flex-direction: column;
        }
        .download {
            justify-content: center;
        }
    }
</style>
</head>
